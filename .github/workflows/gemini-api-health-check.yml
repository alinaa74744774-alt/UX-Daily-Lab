name: Gemini API Health Check

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model to check (one request, no retries)"
        required: true
        type: choice
        default: gemini-3.8-flash
        options:
          - gemini-3.8-flash
          - gemini-3.1-flash-lite

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Send one minimal Gemini request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
        run: python .github/scripts/gemini_health_check.py
