name: Daily Generator Mock Tests

on:
  pull_request:
    paths:
      - ".github/scripts/daily_generator.py"
      - ".github/workflows/daily-course-generator.yml"
      - "tests/**"

permissions:
  contents: read

jobs:
  mock-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run mock-only generator tests
        run: python -m unittest discover -s tests -v
